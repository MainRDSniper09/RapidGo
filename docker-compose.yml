name: rapidgo-bigdata

services:

  # ==========================================================
  # APACHE KAFKA
  # ==========================================================
  kafka:
    image: apache/kafka:4.3.1
    container_name: rapidgo-kafka
    hostname: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      # Kafka funcionando sin Zookeeper mediante KRaft
      KAFKA_PROCESS_ROLES: broker,controller

      # Listener para aplicaciones externas (Windows)
      # y listener interno para los demás contenedores.
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:19092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:19092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Configuración apropiada para laboratorio con un solo broker
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Los topics se crearán explícitamente
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - rapidgo-net

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # ==========================================================
  # KAFKA INIT - Crea el topic definido en ADR-001
  # (auto-create está desactivado, por eso se crea explícitamente)
  # Se ejecuta una vez y termina.
  # ==========================================================
  kafka-init:
    image: apache/kafka:4.3.1
    container_name: rapidgo-kafka-init

    depends_on:
      kafka:
        condition: service_healthy

    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
          --create --if-not-exists \
          --topic preparacion_pedidos \
          --partitions 3 \
          --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
          --describe --topic preparacion_pedidos

    networks:
      - rapidgo-net

    restart: "no"


  # ==========================================================
  # SPARK MASTER
  # ==========================================================
  spark-master:
    image: spark:4.2.0-python3
    container_name: rapidgo-spark-master
    hostname: spark-master

    depends_on:
      kafka-init:
        condition: service_completed_successfully

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"

    ports:
      - "7077:7077"
      - "8080:8080"

    volumes:
      - ./spark:/opt/spark/work-dir/spark
      - ./samples:/opt/spark/work-dir/samples
      - ./datalake:/opt/spark/work-dir/datalake

    networks:
      - rapidgo-net


  # ==========================================================
  # SPARK WORKER 1
  # ==========================================================
  spark-worker-1:
    image: spark:4.2.0-python3
    container_name: rapidgo-spark-worker-1
    hostname: spark-worker-1

    depends_on:
      - spark-master

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "1"
      - --memory
      - 768m
      - --webui-port
      - "8081"

    ports:
      - "8081:8081"

    volumes:
      - ./spark:/opt/spark/work-dir/spark
      - ./samples:/opt/spark/work-dir/samples
      - ./datalake:/opt/spark/work-dir/datalake

    networks:
      - rapidgo-net


  # ==========================================================
  # SPARK WORKER 2
  # ==========================================================
  spark-worker-2:
    image: spark:4.2.0-python3
    container_name: rapidgo-spark-worker-2
    hostname: spark-worker-2

    depends_on:
      - spark-master

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "1"
      - --memory
      - 768m
      - --webui-port
      - "8081"

    ports:
      - "8082:8081"

    volumes:
      - ./spark:/opt/spark/work-dir/spark
      - ./samples:/opt/spark/work-dir/samples
      - ./datalake:/opt/spark/work-dir/datalake

    networks:
      - rapidgo-net


# ============================================================
# RED INTERNA
# ============================================================
networks:
  rapidgo-net:
    driver: bridge


# ============================================================
# VOLÚMENES
# ============================================================
volumes:
  kafka-data: