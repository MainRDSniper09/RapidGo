name: rapidgo-bigdata

services:

  # ==========================================================
  # APACHE KAFKA
  # ==========================================================
  kafka:
    image: apache/kafka:4.3.1
    container_name: rapidgo-kafka
    hostname: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      # Kafka funcionando sin Zookeeper mediante KRaft
      KAFKA_PROCESS_ROLES: broker,controller

      # Listener para aplicaciones externas (Windows)
      # y listener interno para los demás contenedores.
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:19092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:19092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Configuración apropiada para laboratorio con un solo broker
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Los topics se crearán explícitamente
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - rapidgo-net

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # ==========================================================
  # KAFKA INIT - Crea el topic definido en ADR-001
  # (auto-create está desactivado, por eso se crea explícitamente)
  # Se ejecuta una vez y termina.
  # ==========================================================
  kafka-init:
    image: apache/kafka:4.3.1
    container_name: rapidgo-kafka-init

    depends_on:
      kafka:
        condition: service_healthy

    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
          --create --if-not-exists \
          --topic preparacion_pedidos \
          --partitions 3 \
          --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
          --describe --topic preparacion_pedidos

    networks:
      - rapidgo-net

    restart: "no"


  # ==========================================================
  # SPARK MASTER
  # ==========================================================
  spark-master:
    image: spark:4.2.0-python3
    container_name: rapidgo-spark-master
    hostname: spark-master

    depends_on:
      kafka-init:
        condition: service_completed_successfully

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"

    ports:
      - "7077:7077"
      - "8080:8080"

    volumes:
      - ./spark:/opt/spark/work-dir/spark
      - ./samples:/opt/spark/work-dir/samples
      - ./datalake:/opt/spark/work-dir/datalake

    networks:
      - rapidgo-net


  # ==========================================================
  # SPARK WORKER 1
  # ==========================================================
  spark-worker-1:
    image: spark:4.2.0-python3
    container_name: rapidgo-spark-worker-1
    hostname: spark-worker-1

    depends_on:
      - spark-master

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "1"
      - --memory
      - 768m
      - --webui-port
      - "8081"

    ports:
      - "8081:8081"

    volumes:
      - ./spark:/opt/spark/work-dir/spark
      - ./samples:/opt/spark/work-dir/samples
      - ./datalake:/opt/spark/work-dir/datalake

    networks:
      - rapidgo-net


  # ==========================================================
  # SPARK WORKER 2
  # ==========================================================
  spark-worker-2:
    image: spark:4.2.0-python3
    container_name: rapidgo-spark-worker-2
    hostname: spark-worker-2

    depends_on:
      - spark-master

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "1"
      - --memory
      - 768m
      - --webui-port
      - "8081"

    ports:
      - "8082:8081"

    volumes:
      - ./spark:/opt/spark/work-dir/spark
      - ./samples:/opt/spark/work-dir/samples
      - ./datalake:/opt/spark/work-dir/datalake

    networks:
      - rapidgo-net


  # ==========================================================
  # POSTGRES - Base de metadatos de Airflow (Issue #12)
  # ==========================================================
  airflow-postgres:
    image: postgres:16
    container_name: rapidgo-airflow-postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data

    networks:
      - rapidgo-net

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 10


  # ==========================================================
  # APACHE AIRFLOW - Orquestación batch (Issue #12)
  # "standalone" levanta en un solo contenedor: api-server (UI),
  # scheduler, dag-processor y triggerer. UI en http://localhost:8085
  # ==========================================================
  airflow:
    build: ./airflow
    image: rapidgo-airflow:3.3.2
    container_name: rapidgo-airflow
    hostname: airflow

    depends_on:
      airflow-postgres:
        condition: service_healthy

    command: standalone

    # Mismo UID que los contenedores de Spark (185). El Data Lake es un bind
    # mount compartido: Spark crea raw/, processed/ y checkpoints/ con permisos
    # 755, y con el UID por defecto de Airflow (50000) las tasks fallaban con
    # PermissionError al escribir en processed/ (Issue #15). La imagen de
    # Airflow admite cualquier UID siempre que el grupo sea 0.
    user: "185:0"

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Bogota
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
      # Código del proyecto (producer/) disponible para las tasks
      PYTHONPATH: /opt/airflow/project
      RAPIDGO_DATALAKE: /opt/airflow/datalake

    ports:
      - "8085:8080"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/simple_auth_manager_passwords.json:/opt/airflow/simple_auth_manager_passwords.json
      - ./producer:/opt/airflow/project/producer
      - ./samples:/opt/airflow/project/samples
      - ./datalake:/opt/airflow/datalake

    networks:
      - rapidgo-net

    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/v2/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s


# ============================================================
# RED INTERNA
# ============================================================
networks:
  rapidgo-net:
    driver: bridge


# ============================================================
# VOLÚMENES
# ============================================================
volumes:
  kafka-data:
  airflow-postgres-data:
